[package]
name = "stnbt-py"
description = "PyO3 bindings exposing the Rust core as starlark_to_nbt._core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py313"] }
stnbt-core.workspace = true
