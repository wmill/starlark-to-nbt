[package]
name = "stnbt-core"
description = "Core pipeline for starlark-to-nbt: IR validation, layout, lowering, execution, and structure NBT serialization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }
indexmap = "2.14.2"
rustc-hash = "2.1.3"

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
