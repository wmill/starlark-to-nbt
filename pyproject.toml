[project]
name = "starlark-to-nbt"
version = "0.1.0"
description = "Declarative Minecraft structure NBT from Starlark, built by a Rust core"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
starlark-to-nbt = "starlark_to_nbt.cli:main"

[dependency-groups]
dev = [
    # Tests decode the structure NBT the Rust core writes.
    "nbtlib>=2.0.4",
    "pytest>=8.4",
]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed Rust/Python project: the Rust core is compiled into the
# starlark_to_nbt._core extension module next to the Python sources.
manifest-path = "crates/stnbt-py/Cargo.toml"
python-source = "src"
module-name = "starlark_to_nbt._core"

[tool.uv]
# Rebuild the extension on `uv sync`/`uv run` whenever Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/*.star" },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "parity: slow corpus gates (the native binary against the golden manifest; skip with -m 'not parity')",
]
