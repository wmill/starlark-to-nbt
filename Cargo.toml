[workspace]
resolver = "3"
members = ["crates/stnbt-core", "crates/stnbt-cli", "crates/stnbt-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
stnbt-core = { path = "crates/stnbt-core" }

[profile.release]
lto = "thin"
codegen-units = 1
